<section class="experience mt-5">
  <h2 class="text-center capitalize pt-2 color-green">
    <fa-icon class="mr-2 text-yellow-500" [icon]="explosion"></fa-icon
    >&nbsp;Experience
  </h2>

  <div class="font-bold text-3xl mb-3 text-white capitalize text-center">
    Total
    <span class="color-green"
      >{{ roundedYearsOfExperience }}.{{ remainingMonths }}+
    </span>
    Years of Experience as an Angular Developer

    <div class="text-700 text-2xl mt-5">
      <p-button
        [link]="true"
        [outlined]="true"
        severity="success"
        href="mailto:deepanappu1999@gmail.com"
        ><a style="color: #20bf6b" href="mailto:deepanappu1999@gmail.com"
          >Hire me</a
        ></p-button
      >
    </div>
  </div>

  <div class="flex flex-column align-items-center justify-content-center mt-6">
    <div class="experience w-full lg:w-25rem mt-5">
      <div>
        <p-card role="region">
          <h2 class="text-center text-xl text-primary capitalize">Emagine</h2>
        </p-card>
      </div>
    </div>

    <div class="flex justify-content-center">
      <div class="border-left-1 border-300 vertical-line"></div>
    </div>

    <div class="experience w-full lg:w-25rem">
      <p-card role="region">
        <h2 class="text-center text-xl text-primary capitalize">
          wissen Infotech
        </h2>
      </p-card>
    </div>
  </div>
</section>
